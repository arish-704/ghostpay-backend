server:
  port: ${PORT:8080}


spring:
  application:
    name: ghostpay-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:ghostpay;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: ${SPRING_JPA_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

ghostpay:
  mesh:
    packet-ttl-max: 10
    packet-freshness-hours: 24
  crypto:
    key-size: 2048

